name: kivia

services:

  migrate:
    image: migrate/migrate:v4.19.0
    container_name: kivia_migrate
    env_file:
      - .env
    volumes:
      - ./core/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${DATABASE_URL}
      - up
    mem_limit: 128m
    cpus: 0.25
    networks:
      - internal

  core:
    build: './core'
    ports:
      - '8081'
    container_name: core
    env_file:
      - .env
    environment:
      PORT: 8081
    depends_on:
      migrate:
        condition: service_completed_successfully
      # postgres:
      #   condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://core:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal

  nginx:
    build: './nginx'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - internal

  # postgres:
  #   image: 'postgres:16-alpine'
  #   ports:
  #     - '5432'
  #   container_name: kivia_db
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  #     POSTGRES_DB: ${POSTGRES_DB:-kivia}
  #   volumes:
  #     - kivia_db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kivia}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - internal

volumes:
  # kivia_db_data:
  letsencrypt:
    external: true
  certbot_www:

networks:
  internal:
