name: kivia

services:

  migrate:
    image: migrate/migrate:v4.19.0
    container_name: kivia_migrate
    volumes:
      - ./core/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${DATABASE_URL}
      - up

  core:
    build: './core'
    ports:
      - '8081:8081'
    container_name: core
    environment:
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kivia
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_FRONTEND_URL: ${GOOGLE_FRONTEND_URL}
      SENDER_EMAIL: ${SENDER_EMAIL}
      SENDER_NAME: ${SENDER_NAME}
      BREVO_API_KEY: ${BREVO_API_KEY}
      KIVIA_API_KEY: ${KIVIA_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://core:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  kivia_db_data:
